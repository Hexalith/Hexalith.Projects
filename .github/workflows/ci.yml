name: CI

on:
  push:
    branches:
      - main
      - next
      - alpha
      - beta
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  workflow-gates:
    name: Validate workflow policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Validate production-authority scheduling guard
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m venv "${RUNNER_TEMP}/production-authority-tests"
          "${RUNNER_TEMP}/production-authority-tests/bin/python" -m pip install --disable-pip-version-check pyyaml==6.0.3
          "${RUNNER_TEMP}/production-authority-tests/bin/python" -m unittest tests/tools/test_production_authority_guard.py -v

      - name: Validate BMAD Loop hook relay
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_bmad_loop_hook.py -v

      - name: Validate shared skill renderer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_render_skill.py -v

      - name: Validate Git whitespace policy
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_git_whitespace_policy.py -v

      - name: Validate Build Auto workspace ownership
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .agents/skills/bmad-build-auto/scripts/tests/test_workspace_ownership.py

      - name: Validate BMAD legacy cleanup atomicity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .agents/skills/bmad-module-builder/scripts/tests/test-cleanup-legacy.py

      - name: Validate BMAD merge atomicity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m venv "${RUNNER_TEMP}/bmad-merge-tests"
          "${RUNNER_TEMP}/bmad-merge-tests/bin/python" -m pip install --disable-pip-version-check pyyaml==6.0.3
          "${RUNNER_TEMP}/bmad-merge-tests/bin/python" .agents/skills/bmad-module-builder/scripts/tests/test-merge-atomicity.py

      - name: Validate release package tool fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_release_package_tools.py -v

      - name: Validate release workflow shell behavior
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_release_workflow.py -v

      - name: Validate G-6 packet gitlink check fixtures
        # Hermetic G-6 fixtures only: the real G-6 checks run in the g6-candidate and g6-acceptance
        # jobs, so G-6 drift never blocks the jobs that need workflow-gates.
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_check_g6_packet_gitlinks.py -v

      - name: Validate status-aware G-6 gate fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_run_g6_candidate_gate.py -v

      - name: Validate CI/CD invariants
        shell: pwsh
        run: ./tests/tools/run-ci-workflow-gates.ps1

  ci:
    needs: workflow-gates
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@caad9bae6da30f667f82f6005758f2916fa766a8
    with:
      # Bare solution path only. The callee runs `dotnet restore "$SOLUTION"`, so an
      # embedded `-p:` switch is parsed as part of the project path (MSB1009), and
      # `github.workspace` is empty when a reusable-workflow `with:` is evaluated.
      # Directory.Build.props auto-detects HexalithCommonsRoot from references/.
      solution: Hexalith.Projects.CI.slnx
      dapr-version: '1.18.0'
      dapr-runtime-version: '1.18.2'
      test-platform: microsoft-testing-platform
      run-consumer-validation: true
      build-timeout-minutes: 30
      unit-test-projects: |
        tests/Hexalith.Projects.Contracts.Tests
        tests/Hexalith.Projects.Client.Tests
        tests/Hexalith.Projects.Tests
        tests/Hexalith.Projects.Server.Tests
        tests/Hexalith.Projects.UI.Tests
        tests/Hexalith.Projects.Mcp.Tests
        tests/Hexalith.Projects.Cli.Tests
      integration-test-projects: |
        tests/Hexalith.Projects.Integration.Tests

  project-gates:
    name: Projects generated-artifact gates
    runs-on: ubuntu-latest
    needs: ci
    env:
      CI: 'true'
      HexalithCommonsRoot: ${{ github.workspace }}/references/Hexalith.Commons
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@caad9bae6da30f667f82f6005758f2916fa766a8

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@caad9bae6da30f667f82f6005758f2916fa766a8
        with:
          global-json-file: global.json

      - name: FrontComposer inspect gate
        shell: pwsh
        timeout-minutes: 15
        run: ./tests/tools/run-frontcomposer-inspect-gate.ps1

      - name: OpenAPI fingerprint / compatibility gate
        shell: pwsh
        timeout-minutes: 15
        run: ./tests/tools/run-openapi-fingerprint-gate.ps1

  # Every G-6 check runs in the two G-6 jobs below, which need only workflow-gates and which no
  # other job needs, so G-6 drift (a bound file, a submodule gitlink that moved after the packet
  # capture, or a Builds execution SHA that differs from the Builds gitlink) fails only these two
  # jobs while workflow-gates, ci, project-gates and e2e still run.
  #
  # g6-candidate is status-aware: its gate script runs the validator in --candidate mode while
  # packet.json says pending and in accepted-only mode once it says accepted, then the
  # packet-gitlink and Builds execution-SHA checks; the reference test then requires the G-6
  # documents to quote the reviewed packet hash and the current gitlinks.
  g6-candidate:
    name: G-6 runtime/toolchain packet (status-aware)
    runs-on: ubuntu-latest
    needs: workflow-gates
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@caad9bae6da30f667f82f6005758f2916fa766a8

      - name: Run status-aware G-6 gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 tests/tools/run_g6_candidate_gate.py
          --baseline references/Hexalith.Builds/Tools/runtime-toolchain-baseline-2026-09-29.json
          --packet _bmad-output/implementation-artifacts/qualification-evidence/g-6-runtime-toolchain-20260929/packet.json

      - name: Require G-6 documents to quote the packet and gitlinks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_g6_packet_references.py -v

  # Fail-closed G-6 owner acceptance: the accepted-only validator, then the packet-gitlink check.
  # While the packet is pending this job fails, and no other job needs it. Owner acceptance of the
  # exact packet changes only packet.json status from pending to accepted, recorded with a named
  # decision; no bound file (this workflow, the gate scripts, the validator or the baseline)
  # changes, and both G-6 jobs then pass.
  # Releases stay blocked until that owner acceptance: release.yml verify-source requires a
  # successful push run of this workflow, and this failing job makes every run unsuccessful.
  g6-acceptance:
    name: G-6 owner acceptance (accepted-only)
    runs-on: ubuntu-latest
    needs: workflow-gates
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@caad9bae6da30f667f82f6005758f2916fa766a8

      - name: Validate fresh G-6 runtime/toolchain packet
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 references/Hexalith.Builds/Tools/validate-runtime-toolchain-evidence.py
          --workspace .
          --baseline references/Hexalith.Builds/Tools/runtime-toolchain-baseline-2026-09-29.json
          --packet _bmad-output/implementation-artifacts/qualification-evidence/g-6-runtime-toolchain-20260929/packet.json

      - name: Require G-6 packet revisions to equal root gitlinks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 tests/tools/check_g6_packet_gitlinks.py
          --packet _bmad-output/implementation-artifacts/qualification-evidence/g-6-runtime-toolchain-20260929/packet.json

  # Replays the pending P1R candidate's release-bypass and checkout-drift claims against the
  # public EventStore Actions runs and the EventStore history at the root gitlink.
  p1r-candidate-evidence:
    name: P1R candidate evidence replay
    runs-on: ubuntu-latest
    needs: workflow-gates
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@caad9bae6da30f667f82f6005758f2916fa766a8

      - name: Fetch EventStore tags read by the P1R evidence replay
        run: >-
          git -C references/Hexalith.EventStore fetch --no-tags origin
          +refs/tags/v3.70.1:refs/tags/v3.70.1
          +refs/tags/v3.109.0:refs/tags/v3.109.0

      - name: Replay P1R candidate evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tests/tools/test_p1r_candidate_evidence.py -v

  e2e:
    name: Scheduled managed AppHost E2E
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    needs:
      - ci
      - workflow-gates
      - project-gates
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@caad9bae6da30f667f82f6005758f2916fa766a8

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@caad9bae6da30f667f82f6005758f2916fa766a8
        with:
          global-json-file: global.json

      - name: Initialize Dapr
        uses: ./references/Hexalith.Builds/Github/dapr-init
        with:
          version: '1.18.0'
          runtime-version: '1.18.2'

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 13.5.4

      - name: Initialize Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        env:
          CI: '1'
        run: npm --prefix tests/e2e ci --ignore-scripts

      - name: Install Playwright browsers explicitly
        run: npm --prefix tests/e2e run install:browsers

      - name: Run managed AppHost E2E suite
        timeout-minutes: 45
        env:
          CI: '1'
          KEYCLOAK_CLIENT_ID: hexalith-eventstore
          TEST_USER_USERNAME: admin-user
          TEST_USER_PASSWORD: ${{ secrets.PROJECTS_E2E_TEST_USER_PASSWORD }}
        run: npm --prefix tests/e2e run test:live:managed

      - name: Stop the exact Projects AppHost
        if: always()
        run: aspire stop --apphost "$GITHUB_WORKSPACE/src/Hexalith.Projects.AppHost/Hexalith.Projects.AppHost.csproj" --non-interactive || true

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-evidence-${{ github.sha }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
