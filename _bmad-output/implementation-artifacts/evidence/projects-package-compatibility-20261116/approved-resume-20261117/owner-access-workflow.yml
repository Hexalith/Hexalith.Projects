name: Qualify approved package owner access

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: qualify-approved-package-owner-access
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.repository == 'Hexalith/Hexalith.CiCd' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cicd-app
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repository: [Hexalith.EventStore, Hexalith.Projects]
    steps:
      - name: Mint a read-only token for one approved package owner
        id: token
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEXALITH_CICD_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEXALITH_CICD_APP_PRIVATE_KEY }}
          owner: Hexalith
          repositories: ${{ matrix.repository }}
          permission-contents: read

      - name: Verify fixed repository visibility without writes
        if: ${{ !cancelled() }}
        env:
          PACKAGE_OWNER_REPOSITORY: ${{ matrix.repository }}
          PACKAGE_OWNER_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGE_OWNER_TOKEN_RESULT: ${{ steps.token.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request
          repository = os.environ['PACKAGE_OWNER_REPOSITORY']
          allowed = {'Hexalith.EventStore', 'Hexalith.Projects'}
          if repository not in allowed:
              raise SystemExit('Unexpected package owner')
          token = os.environ.get('PACKAGE_OWNER_TOKEN', '')
          receipt = {'repository': 'Hexalith/' + repository, 'status': 'failed',
                     'token_result': os.environ.get('PACKAGE_OWNER_TOKEN_RESULT'),
                     'requested_permissions': {'contents': 'read'}, 'write_operations': 0}
          output = Path('package-owner-' + repository + '.json')
          try:
              if not token or receipt['token_result'] != 'success':
                  raise RuntimeError('Existing App installation did not provide the scoped read token')
              def get(path):
                  request = urllib.request.Request('https://api.github.com/' + path,
                      headers={'Authorization': 'Bearer ' + token,
                               'Accept': 'application/vnd.github+json',
                               'X-GitHub-Api-Version': '2022-11-28',
                               'User-Agent': 'Hexalith-CiCd-package-owner-access'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              names = sorted(item['full_name'] for item in get('installation/repositories')['repositories'])
              if names != ['Hexalith/' + repository]:
                  raise RuntimeError('Read token repository selection is not the one fixed target')
              ref = get('repos/Hexalith/' + repository + '/git/ref/heads/main')
              receipt.update(status='qualified', repositories=names, main=ref['object']['sha'])
          except Exception as error:
              receipt['reason'] = str(error).replace(token, '[masked]') if token else str(error)
          output.write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          raise SystemExit(0 if receipt['status'] == 'qualified' else 1)
          PY

      - name: Retain read-only owner access result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-owner-access-${{ matrix.repository }}
          path: package-owner-${{ matrix.repository }}.json
          if-no-files-found: warn
          retention-days: 30
